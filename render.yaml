# Deploy do Ingressou no Render (plano gratuito)
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ingressou
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn ingressou.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ingressou.onrender.com   # ajuste para o endereço que o Render te der
      - key: SITE_URL
        value: https://ingressou.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://ingressou.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: ingressou-db
          property: connectionString

databases:
  - name: ingressou-db
    plan: free
